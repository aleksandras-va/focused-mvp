name: focused

services:
  postgres:
    image: postgres:18-alpine
    container_name: focused-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: focused
      POSTGRES_PASSWORD: focused
      POSTGRES_DB: focused
      # Lithuanian data: keep sorting/comparison predictable for lt-LT text.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=lt-LT --locale=C"
    ports:
      # 5432/5433 are taken by other local stacks, so this one lives on 5434.
      - "5434:5432"
    volumes:
      # Postgres 18 keeps PGDATA at /var/lib/postgresql/18/docker, so the
      # whole /var/lib/postgresql directory is the volume mount point.
      - focused-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focused -d focused"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  focused-pgdata:
